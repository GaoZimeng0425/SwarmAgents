appId: dev.swarmagents.app
productName: SwarmAgents
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # sherpa-onnx ships native .node + onnxruntime .dylib loaded at runtime;
  # they must live unpacked on disk, not inside the asar archive.
  - node_modules/sherpa-onnx-node/**
  - node_modules/sherpa-onnx-*/**
# Registers swarmagents:// as a default protocol client. electron-builder
# writes the macOS CFBundleURLTypes (Info.plist) and Windows NSIS registry keys.
protocols:
  - name: SwarmAgents
    schemes:
      - swarmagents
win:
  executableName: swarm-agents
  icon: resources/icon.ico
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  # Screen Recording + Accessibility (used by the peekaboo screen tools) are
  # TCC permissions granted at runtime in System Settings — they have no
  # Info.plist usage-description keys, so nothing to declare here. If click/type
  # automation is added later, add NSAppleEventsUsageDescription.
  notarize: false
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
