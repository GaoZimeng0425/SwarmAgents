document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <input id=\"cmd-input\" value=\"{{ query }}\" oninput=\"{{ onInput }}\" onkeydown=\"{{ onKey }}\" placeholder=\"{{ scope.placeholder }}\" autocomplete=\"off\" spellcheck=\"false\" style=\"flex:1;min-width:0;border:none;background:transparent;outline:none;font:400 20px system-ui;color:#1c1c1e;padding:0\">\n        <div style=\"flex:none;display:flex;align-items:center;gap:7px\">\n          <span style=\"font:500 11.5px system-ui;color:#a8a8a2;font-variant-numeric:tabular-nums\">{{ resultCount }} 结果<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- BODY: results + preview -->\n      <div style=\"flex:1;min-height:0;display:flex\">\n\n        <!-- RESULTS -->\n        <div class=\"cmdscroll\" style=\"flex:1;min-width:0;overflow-y:auto;padding:8px 8px 10px\">\n          <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"padding:0 6px\">\n              <div style=\"display:flex;align-items:center;gap:8px;padding:11px 8px 5px\">\n                <span style=\"font:600 11px system-ui;letter-spacing:.03em;color:#9a9a94;text-transform:uppercase\">{{ g.heading }}<\u002Fspan>\n                <span style=\"flex:1;height:.5px;background:rgba(0,0,0,.06)\"><\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <button type=\"button\" onclick=\"{{ it.onClick }}\" onmouseenter=\"{{ it.onHover }}\" style=\"{{ it.rowStyle }}\">\n                  <div style=\"{{ it.iconWrap }}\">\n                    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.85\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><sc-for list=\"{{ it.iconPaths }}\" as=\"d\" hint-placeholder-count=\"1\"><path d=\"{{ d }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>\n                  <\u002Fdiv>\n                  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                    <div style=\"font:{{ it.titleFont }};color:#1c1c1e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.tPre }}<span style=\"color:#4b45c4;background:rgba(94,92,230,.16);border-radius:3px;padding:0 1px\">{{ it.tMatch }}<\u002Fspan>{{ it.tPost }}<\u002Fdiv>\n                    <sc-if value=\"{{ it.hasSub }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font:400 12px/1.4 system-ui;color:#8a8a84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.sPre }}<span style=\"color:#4b45c4;font-weight:600\">{{ it.sMatch }}<\u002Fspan>{{ it.sPost }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ it.progress }}\" hint-placeholder-val=\"\">\n                    <div style=\"flex:none;display:flex;align-items:center;gap:7px;margin-right:2px\"><div style=\"width:52px;height:5px;border-radius:3px;background:rgba(0,0,0,.09);overflow:hidden\"><div style=\"height:100%;width:{{ it.progress }};background:#5e5ce6;border-radius:3px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ it.badge }}\" hint-placeholder-val=\"\">\n                    <span style=\"flex:none;font:600 10px system-ui;letter-spacing:.02em;color:{{ it.badgeColor }};background:{{ it.badgeBg }};border-radius:5px;padding:3px 7px\">{{ it.badge }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ it.meta }}\" hint-placeholder-val=\"\">\n                    <span style=\"flex:none;font:500 11.5px ui-monospace,Menlo,monospace;color:#a8a8a2\">{{ it.meta }}<\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ it.selected }}\" hint-placeholder-val=\"\">\n                    <svg style=\"flex:none\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b0b0aa\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"\">\n            <div style=\"padding:56px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center\">\n              <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c2c2bc\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n              <div style=\"font:500 13.5px system-ui;color:#9a9a94\">没有匹配「{{ query }}」的结果<\u002Fdiv>\n              <div style=\"font:400 12px system-ui;color:#b6b6b0\">试试直接把它交给 Agent —— 回车即新建任务<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- PREVIEW -->\n        <div class=\"cmdscroll\" style=\"width:296px;flex:none;overflow-y:auto;border-left:.5px solid rgba(0,0,0,.08);background:rgba(255,255,255,.4)\">\n          <div style=\"padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px\">\n\n            <!-- header -->\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <div style=\"{{ pv.iconWrap }}\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><sc-for list=\"{{ pv.iconPaths }}\" as=\"d\" hint-placeholder-count=\"1\"><path d=\"{{ d }}\"><\u002Fpath><\u002Fsc-for><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font:600 16px/1.35 system-ui;color:#1c1c1e\">{{ pv.title }}<\u002Fdiv>\n              <sc-if value=\"{{ pv.kindLabel }}\" hint-placeholder-val=\"\">\n                <span style=\"align-self:flex-start;font:600 10.5px system-ui;letter-spacing:.02em;color:{{ pv.color }};background:{{ pv.tint }};border-radius:6px;padding:3px 8px\">{{ pv.kindLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <!-- DISPATCH -->\n            <sc-if value=\"{{ pv.isDispatch }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex;flex-direction:column;gap:13px\">\n                <div style=\"font:400 12.5px/1.55 system-ui;color:#6b6b70\">回车会新建一个任务,让所选编队立即开始执行。你可随时在任务台查看进度。<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 10.5px system-ui;letter-spacing:.04em;color:#9a9a94;text-transform:uppercase\">执行编队<\u002Fspan>\n                  <div style=\"display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;background:#fff;border:.5px solid rgba(0,0,0,.1)\"><span style=\"width:22px;height:22px;border-radius:7px;background:rgba(94,92,230,.14);display:flex;align-items:center;justify-content:center\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5e5ce6\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3.5 20a5.5 5.5 0 0 1 11 0M16 6.5a3 3 0 0 1 0 5.5M20.5 20a5.2 5.2 0 0 0-4-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"flex:1;font:600 13px system-ui;color:#1c1c1e\">研究编队<\u002Fspan><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a8a8a2\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 10.5px system-ui;letter-spacing:.04em;color:#9a9a94;text-transform:uppercase\">预计步骤<\u002Fspan>\n                  <sc-for list=\"{{ pv.steps }}\" as=\"s\" hint-placeholder-count=\"3\"><div style=\"display:flex;gap:9px;font:400 12.5px/1.45 system-ui;color:#4a4a50\"><span style=\"flex:none;width:18px;height:18px;border-radius:50%;background:rgba(94,92,230,.12);color:#5e5ce6;font:600 10px system-ui;display:flex;align-items:center;justify-content:center;margin-top:1px\">{{ s.n }}<\u002Fspan><span>{{ s.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- CHAT -->\n            <sc-if value=\"{{ pv.isChat }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ pv.msgs }}\" as=\"m\" hint-placeholder-count=\"3\"><div style=\"display:flex;flex-direction:column;gap:3px\"><span style=\"font:600 10.5px system-ui;color:{{ m.color }}\">{{ m.role }}<\u002Fspan><span style=\"font:400 12.5px/1.5 system-ui;color:#4a4a50\">{{ m.text }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n                <div style=\"font:400 11px system-ui;color:#b0b0aa;margin-top:2px\">更新于 {{ pv.updated }} · {{ pv.count }} 条消息<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- TASK RUNNING -->\n            <sc-if value=\"{{ pv.isTaskRun }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <div><div style=\"display:flex;justify-content:space-between;font:600 12px system-ui;color:#4a4a50;margin-bottom:6px\"><span>{{ pv.stepText }}<\u002Fspan><span style=\"color:#5e5ce6\">{{ pv.progress }}<\u002Fspan><\u002Fdiv><div style=\"height:7px;border-radius:4px;background:rgba(0,0,0,.08);overflow:hidden\"><div style=\"height:100%;width:{{ pv.progress }};background:linear-gradient(90deg,#5e5ce6,#7a76d8);border-radius:4px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px\"><span style=\"font:600 10.5px system-ui;letter-spacing:.04em;color:#9a9a94;text-transform:uppercase\">实时日志<\u002Fspan><sc-for list=\"{{ pv.logs }}\" as=\"l\" hint-placeholder-count=\"3\"><div style=\"display:flex;gap:8px;font:400 11.5px/1.4 ui-monospace,Menlo,monospace;color:#6b6b70\"><span style=\"color:#c2c2bc\">{{ l.t }}<\u002Fspan><span style=\"flex:1\">{{ l.m }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- TASK SCHEDULED -->\n            <sc-if value=\"{{ pv.isTaskSched }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ pv.rows }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"display:flex;justify-content:space-between;gap:12px;font:400 12.5px system-ui\"><span style=\"color:#9a9a94\">{{ r.k }}<\u002Fspan><span style=\"color:#3a3a40;font-weight:500;text-align:right\">{{ r.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n                <div style=\"padding:11px;border-radius:9px;background:#fff;border:.5px solid rgba(0,0,0,.08)\"><div style=\"font:600 10.5px system-ui;color:#9a9a94;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px\">上次结果<\u002Fdiv><div style=\"font:400 12.5px/1.5 system-ui;color:#4a4a50\">{{ pv.last }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- INFO (command/service/agent/file/memory/skill) -->\n            <sc-if value=\"{{ pv.isInfo }}\" hint-placeholder-val=\"\">\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <sc-if value=\"{{ pv.desc }}\" hint-placeholder-val=\"\"><div style=\"font:400 12.5px/1.55 system-ui;color:#6b6b70\">{{ pv.desc }}<\u002Fdiv><\u002Fsc-if>\n                <sc-if value=\"{{ pv.hasRows }}\" hint-placeholder-val=\"\"><div style=\"display:flex;flex-direction:column;gap:8px\"><sc-for list=\"{{ pv.rows }}\" as=\"r\" hint-placeholder-count=\"2\"><div style=\"display:flex;justify-content:space-between;gap:12px;font:400 12.5px system-ui\"><span style=\"color:#9a9a94\">{{ r.k }}<\u002Fspan><span style=\"color:#3a3a40;font-weight:500;text-align:right\">{{ r.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- FOOTER -->\n      <div style=\"flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:.5px solid rgba(0,0,0,.09);background:rgba(255,255,255,.32)\">\n        <span style=\"width:19px;height:19px;border-radius:5px;background:rgba(94,92,230,.12);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5e5ce6\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 3 14h7l-1 8 9-12h-7z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span style=\"font:500 12px system-ui;color:#8a8a84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px\">{{ footerLabel }}<\u002Fspan>\n        <span style=\"flex:1\"><\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:6px;font:500 12px system-ui;color:#6b6b70\"><span>{{ primaryAction }}<\u002Fspan><kbd>↵<\u002Fkbd><\u002Fdiv>\n        <span style=\"width:.5px;height:18px;background:rgba(0,0,0,.12)\"><\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:6px;font:500 12px system-ui;color:#6b6b70\"><span>操作<\u002Fspan><kbd>⌘K<\u002Fkbd><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { query: '', sel: 0 }\n\n  componentDidMount() {\n    setTimeout(() => { const el = document.getElementById('cmd-input'); if (el) el.focus() }, 60)\n  }\n\n  // ── icon path sets (24x24 stroke) ──\n  ic = {\n    search: ['M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z', 'm21 21-4.3-4.3'],\n    spark: ['M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4z'],\n    chat: ['M21 11.5a8.4 8.4 0 0 1-9 8.5 8.4 8.4 0 0 1-4-1L3 20l1.5-4a8.5 8.5 0 1 1 15.5-4.5z'],\n    plus: ['M12 5v14M5 12h14'],\n    clock: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7.5v5l3.2 1.8'],\n    file: ['M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z', 'M14 3v5h5'],\n    mail: ['M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z', 'm3.5 6.5 8.5 6 8.5-6'],\n    cal: ['M5 4.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z', 'M3 9.5h18M8 2.5v4M16 2.5v4'],\n    video: ['M4 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z', 'm7 3 3 4M17 3l-3 4M10 12v4M14 12v4'],\n    trend: ['M3 17l6-6 4 4 8-8', 'M17 7h4v4'],\n    team: ['M9 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', 'M3.5 20a5.5 5.5 0 0 1 11 0', 'M16 6.5a3 3 0 0 1 0 5.5M20.5 20a5.2 5.2 0 0 0-4-5'],\n    gear: ['M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4z', 'M19 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V20a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 2.9-1.2V4a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9z'],\n    moon: ['M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z'],\n    export: ['M12 3v12', 'M8 7l4-4 4 4', 'M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4'],\n    brain: ['M9.5 3A3.5 3.5 0 0 0 6 6.5 3 3 0 0 0 5 12.3V16a3 3 0 0 0 4.5 2.6', 'M14.5 3A3.5 3.5 0 0 1 18 6.5 3 3 0 0 1 19 12.3V16a3 3 0 0 1-4.5 2.6', 'M12 4v15'],\n    bolt: ['M13 2 3 14h7l-1 8 9-12h-7z'],\n    arrow: ['M4 12h15', 'M13 6l6 6-6 6'],\n  }\n\n  data() {\n    const I = this.ic\n    return {\n      command: [\n        { title: '新建对话', sub: '开始一个空白会话', meta: '⌘N', icon: I.plus, c: '#3478f6', desc: '打开一个全新的空白对话,直接开始输入。', rows: [['快捷键', '⌘N'], ['位置', '侧栏顶部 +']] },\n        { title: '新建定时任务', sub: '让 Agent 按计划自动执行', icon: I.clock, c: '#ff9500', desc: '设定时间与频率,Agent 会到点自动开跑并把结果推给你。', rows: [['触发', 'Cron / 自然语言'], ['去处', '任务台 › 定时']] },\n        { title: '新建编队', sub: '组合多个 Agent 协作', icon: I.team, c: '#5e5ce6', desc: '把多个 Agent 编成一队分工协作,处理更复杂的目标。' },\n        { title: '打开设置', sub: '偏好 · 服务连接 · 模型', meta: '⌘,', icon: I.gear, c: '#6b6b70', desc: '管理账户、已连接服务、模型与外观。', rows: [['快捷键', '⌘,']] },\n        { title: '切换外观 · 浅色 / 深色', sub: '跟随系统或手动切换', icon: I.moon, c: '#6b6b70', desc: '在浅色、深色与跟随系统之间切换。' },\n        { title: '导出当前对话为 Markdown', sub: '连同 Agent 产出一起导出', icon: I.export, c: '#34c759', desc: '把当前对话及其生成的文件打包导出为 .md。' },\n      ],\n      agent: [\n        { title: '研究编队', sub: '检索 · 阅读 · 归纳 · 3 个 Agent', icon: I.team, c: '#5e5ce6', desc: '擅长深度调研:并行检索、逐篇精读、结构化归纳成报告。', rows: [['成员', '检索 · 阅读 · 写作'], ['本周运行', '14 次']] },\n        { title: '日报编队', sub: '每日汇总邮件 / 日历 / 趋势', icon: I.team, c: '#5e5ce6', desc: '每天把邮件、日程、GitHub 趋势汇总成一份简报。', rows: [['成员', '2 个 Agent'], ['绑定任务', '每日 09:00']] },\n        { title: '监控编队', sub: '盯盘 GitHub 趋势与关键词', icon: I.team, c: '#5e5ce6', desc: '持续监控关键词与仓库,有变化就通知你。' },\n        { title: '通用 Agent', sub: '单个多面手 · 什么都能聊', icon: I.spark, c: '#5e5ce6', desc: '一个全能 Agent,适合临时、开放式的任务。' },\n      ],\n      taskRun: [\n        { title: '分析 B站「研发日常」收藏夹', sub: '进行中 · 第 3 / 8 步', progress: '42%', icon: I.spark, c: '#5e5ce6', stepText: '正在解析视频字幕', logs: [['14:30', '拉取收藏列表 214 项'], ['14:31', '筛出未解析 128 项'], ['14:32', '解析中 54 / 128…']] },\n        { title: '整理今日 Gmail 收件箱', sub: '进行中 · 已分类 18 封', progress: '70%', icon: I.mail, c: '#ea4335', stepText: '按标签归档中', logs: [['14:28', '读取未读 26 封'], ['14:30', '识别 4 个标签'], ['14:31', '归档 18 / 26…']] },\n      ],\n      taskSched: [\n        { title: '每日 09:00 · GitHub 趋势日报', sub: '下次运行 明早 09:00', icon: I.clock, c: '#ff9500', rows: [['频率', '每天 09:00'], ['下次', '明早 09:00'], ['编队', '日报编队']], last: '昨日整理了 12 个热门仓库,置顶「bun v2」。' },\n        { title: '每周一 10:00 · 项目周报', sub: '下次运行 周一 10:00', icon: I.clock, c: '#ff9500', rows: [['频率', '每周一 10:00'], ['下次', '周一 10:00'], ['编队', '通用 Agent']], last: '上周汇总了 23 项任务产出成周报草稿。' },\n      ],\n      file: [\n        { title: '竞品分析.md', sub: '研究编队生成 · 2 天前 · 12 KB', icon: I.file, c: '#3478f6', desc: '一份对比 4 款同类产品的结构化分析。', rows: [['来源', '研究编队'], ['大小', '12 KB'], ['修改', '2 天前']] },\n        { title: '周报-W23.pdf', sub: '导出 · 5 天前 · 340 KB', icon: I.file, c: '#ea4335', rows: [['来源', '手动导出'], ['大小', '340 KB'], ['修改', '5 天前']] },\n        { title: 'bili-summary.json', sub: 'B站分析任务生成 · 昨天', icon: I.file, c: '#ff9500', rows: [['来源', 'B站分析任务'], ['修改', '昨天']] },\n        { title: '趋势快照-0623.png', sub: 'GitHub 趋势任务 · 昨天', icon: I.file, c: '#34c759', rows: [['来源', 'GitHub 趋势任务'], ['修改', '昨天']] },\n      ],\n      chat: [\n        { title: '重构搜索弹窗方案', body: '把 ⌘K 变成统一命令台,直接指派 Agent 是核心', updated: '刚刚', count: 12, msgs: [['你', '⌘K 现在只能搜标题,太浪费了'], ['Agent', '可以把它做成统一命令台:搜索 + 命令 + 直接指派'], ['你', '对,直接输入目标回车就开跑']] },\n        { title: 'B站收藏批量解析', body: '给每个视频生成一句话结论和核心要点', updated: '2 小时前', count: 8, msgs: [['你', '帮我把研发日常收藏夹都解析一遍'], ['Agent', '好的,正在逐个生成摘要与要点']] },\n        { title: 'Gmail 自动分类规则', body: '按发件人和主题把邮件分到不同标签', updated: '昨天', count: 21, msgs: [['你', '订阅类邮件太多了'], ['Agent', '我加了三条规则自动归档']] },\n        { title: 'GitHub 趋势监控', body: '每天筛选 star 增长最快的仓库', updated: '3 天前', count: 6, msgs: [['你', '盯一下 AI Agent 相关的新仓库'], ['Agent', '已建每日趋势任务']] },\n        { title: '周报自动生成', body: '汇总本周所有任务产出成周报', updated: '上周', count: 15, msgs: [['你', '周五帮我出一份周报'], ['Agent', '已排每周一 10:00 自动生成']] },\n      ],\n      service: [\n        { title: 'Bilibili 收藏', sub: '214 个视频 · AI 已解析 86', icon: I.video, c: '#fb7299', desc: '你的 B站收藏库,已被 Agent 解析成可检索的知识库。', rows: [['视频', '214'], ['已解析', '86'], ['收藏夹', '5']] },\n        { title: '日历', sub: '今天 3 个日程', icon: I.cal, c: '#3478f6', desc: '查看与安排日程,Agent 可代你创建与提醒。', rows: [['今日', '3 个'], ['本周', '11 个']] },\n        { title: 'Gmail', sub: '12 封未读', icon: I.mail, c: '#ea4335', desc: '收件箱,支持 Agent 自动分类与起草回复。', rows: [['未读', '12'], ['已连接', '是']] },\n        { title: 'GitHub 趋势', sub: '实时热门仓库', icon: I.trend, c: '#1c1c1e', desc: '实时热门开源仓库,可让 Agent 定时汇总。' },\n      ],\n      memory: [\n        { title: '我更喜欢简洁直接的回答', sub: '记忆 · 回答偏好', icon: I.brain, c: '#34c759', desc: 'Agent 会在所有对话中遵循这条偏好。', rows: [['类型', '偏好'], ['加入', '2 周前']] },\n        { title: '常用技术栈:TypeScript / Go', sub: '记忆 · 技术背景', icon: I.brain, c: '#34c759', desc: '影响 Agent 给代码建议时的默认语言。', rows: [['类型', '技术背景']] },\n      ],\n      skill: [\n        { title: 'read-pdf', sub: '技能 · 解析 PDF 文档', icon: I.bolt, c: '#ff9500', desc: '让 Agent 读取并结构化 PDF 内容。', rows: [['状态', '已启用']] },\n        { title: 'web-search', sub: '技能 · 联网搜索', icon: I.bolt, c: '#ff9500', desc: '让 Agent 联网检索最新信息。', rows: [['状态', '已启用']] },\n      ],\n    }\n  }\n\n  // scope from prefix\n  getScope(q) {\n    const I = this.ic\n    if (q.startsWith('>')) return { mode: 'command', term: q.slice(1).trim(), pill: '命令', color: '#3478f6', pillBg: 'rgba(52,120,246,.13)', iconPaths: ['M4 17l6-6-6-6', 'M12 19h8'], placeholder: '运行命令…' }\n    if (q.startsWith('@')) return { mode: 'agent', term: q.slice(1).trim(), pill: '指派', color: '#5e5ce6', pillBg: 'rgba(94,92,230,.13)', iconPaths: I.team, placeholder: '选择编队或 Agent…' }\n    if (q.startsWith('#')) return { mode: 'task', term: q.slice(1).trim(), pill: '任务', color: '#ff9500', pillBg: 'rgba(255,149,0,.15)', iconPaths: I.clock, placeholder: '查找运行中 / 定时任务…' }\n    if (q.startsWith('/')) return { mode: 'file', term: q.slice(1).trim(), pill: '文件', color: '#34c759', pillBg: 'rgba(52,199,89,.14)', iconPaths: I.file, placeholder: '查找 Agent 产出的文件…' }\n    return { mode: 'mixed', term: q.trim(), pill: '', color: '#5e5ce6', pillBg: '', iconPaths: I.search, placeholder: '搜索、输入命令,或直接把目标交给 Agent…' }\n  }\n\n  hl(text, term) {\n    const t = String(text || '')\n    if (!term) return { pre: t, match: '', post: '' }\n    const i = t.toLowerCase().indexOf(term.toLowerCase())\n    if (i < 0) return { pre: t, match: '', post: '' }\n    return { pre: t.slice(0, i), match: t.slice(i, i + term.length), post: t.slice(i + term.length) }\n  }\n\n  match(item, term) {\n    if (!term) return true\n    const hay = (item.title + ' ' + (item.sub || '') + ' ' + (item.body || '')).toLowerCase()\n    return hay.includes(term.toLowerCase())\n  }\n\n  renderVals() {\n    const D = this.data()\n    const I = this.ic\n    const q = this.state.query\n    const scope = this.getScope(q)\n    const term = scope.term\n    const groups = []\n    const flat = []\n\n    const push = (raw, kind, opts = {}) => {\n      const th = this.hl(raw.title, term)\n      const useBodyHl = kind === 'chat' && term && (raw.body || '').toLowerCase().includes(term.toLowerCase()) && !raw.title.toLowerCase().includes(term.toLowerCase())\n      const sh = useBodyHl ? this.hl(raw.body, term) : { pre: raw.sub || raw.body || '', match: '', post: '' }\n      const it = { raw, kind, th, sh, ...opts }\n      flat.push(it)\n      return it\n    }\n\n    if (scope.mode === 'command') {\n      const items = D.command.filter((c) => this.match(c, term))\n      if (items.length) groups.push({ key: 'cmd', heading: '命令', items: items.map((c) => push(c, 'command', { badge: '命令', badgeColor: '#3478f6', badgeBg: 'rgba(52,120,246,.1)' })) })\n    } else if (scope.mode === 'agent') {\n      const items = D.agent.filter((c) => this.match(c, term))\n      if (items.length) groups.push({ key: 'ag', heading: '编队 & Agent · 回车即指派', items: items.map((c) => push(c, 'agent', { badge: '指派', badgeColor: '#5e5ce6', badgeBg: 'rgba(94,92,230,.1)' })) })\n    } else if (scope.mode === 'task') {\n      const r = D.taskRun.filter((c) => this.match(c, term))\n      const s = D.taskSched.filter((c) => this.match(c, term))\n      if (r.length) groups.push({ key: 'tr', heading: '运行中', items: r.map((c) => push(c, 'taskRun', { progress: c.progress })) })\n      if (s.length) groups.push({ key: 'ts', heading: '定时任务', items: s.map((c) => push(c, 'taskSched', {})) })\n    } else if (scope.mode === 'file') {\n      const items = D.file.filter((c) => this.match(c, term))\n      if (items.length) groups.push({ key: 'fl', heading: '文件 & 产出', items: items.map((c) => push(c, 'file', {})) })\n    } else {\n      // MIXED\n      if (!term) {\n        // empty state\n        const cont = { title: '继续:分析 B站「研发日常」收藏夹', sub: '上次进行到 42% · 点此继续', progress: '42%', icon: I.spark, c: '#5e5ce6', stepText: '正在解析视频字幕', logs: D.taskRun[0].logs }\n        groups.push({ key: 'resume', heading: '继续未完成', items: [push(cont, 'taskRun', { progress: '42%' })] })\n        groups.push({ key: 'sug', heading: '建议操作', items: [D.command[0], D.command[1], D.agent[0]].map((c, i) => push(c, i === 2 ? 'agent' : 'command', { meta: c.meta || '' })) })\n        groups.push({ key: 'recent', heading: '最近对话', items: D.chat.slice(0, 3).map((c) => push(c, 'chat', {})) })\n        groups.push({ key: 'svc', heading: '快捷入口', items: D.service.map((c) => push(c, 'service', {})) })\n      } else {\n        // dispatch hero\n        const dispatch = { title: '让 Agent 去做:「' + term + '」', sub: '新建任务 · 交给研究编队立即执行', icon: I.spark, c: '#5e5ce6', dispatchQuery: term }\n        groups.push({ key: 'disp', heading: '指派给 Agent', items: [push(dispatch, 'dispatch', { badge: '回车开跑', badgeColor: '#5e5ce6', badgeBg: 'rgba(94,92,230,.12)', hero: true })] })\n        const cmd = D.command.filter((c) => this.match(c, term))\n        if (cmd.length) groups.push({ key: 'cmd', heading: '命令', items: cmd.map((c) => push(c, 'command', { meta: c.meta || '' })) })\n        const ch = D.chat.filter((c) => this.match(c, term))\n        if (ch.length) groups.push({ key: 'chat', heading: '对话', items: ch.map((c) => push(c, 'chat', {})) })\n        const fl = D.file.filter((c) => this.match(c, term))\n        if (fl.length) groups.push({ key: 'file', heading: '文件 & 产出', items: fl.map((c) => push(c, 'file', {})) })\n        const tk = [...D.taskRun, ...D.taskSched].filter((c) => this.match(c, term))\n        if (tk.length) groups.push({ key: 'task', heading: '任务', items: tk.map((c) => push(c, c.progress ? 'taskRun' : 'taskSched', { progress: c.progress })) })\n        const misc = [...D.service, ...D.memory, ...D.skill].filter((c) => this.match(c, term))\n        if (misc.length) groups.push({ key: 'misc', heading: '服务 · 记忆 · 技能', items: misc.map((c) => push(c, D.service.includes(c) ? 'service' : (D.memory.includes(c) ? 'memory' : 'skill'), {})) })\n      }\n    }\n\n    // clamp selection\n    let sel = this.state.sel\n    if (sel >= flat.length) sel = flat.length - 1\n    if (sel < 0) sel = 0\n\n    const kindTint = { command: 'rgba(52,120,246,.1)', dispatch: 'rgba(94,92,230,.12)', agent: 'rgba(94,92,230,.12)', chat: 'rgba(0,0,0,.06)', file: 'rgba(52,120,246,.1)', service: 'rgba(0,0,0,.06)', memory: 'rgba(52,199,89,.12)', skill: 'rgba(255,149,0,.13)', taskRun: 'rgba(94,92,230,.12)', taskSched: 'rgba(255,149,0,.13)' }\n\n    // build render items\n    let idx = 0\n    const outGroups = groups.map((g) => ({\n      heading: g.heading,\n      items: g.items.map((it) => {\n        const myIdx = idx++\n        const selected = myIdx === sel\n        const hero = it.hero\n        const rowBg = selected ? (hero ? 'rgba(94,92,230,.14)' : 'rgba(0,0,0,.06)') : 'transparent'\n        const iconBg = it.raw.c ? this.tintOf(it.raw.c) : 'rgba(0,0,0,.06)'\n        return {\n          onClick: () => this.run(it),\n          onHover: () => { if (this.state.sel !== myIdx) this.setState({ sel: myIdx }) },\n          rowStyle: `width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:none;cursor:pointer;border-radius:10px;padding:${hero ? '11px' : '8px'} 10px;background:${rowBg};margin-bottom:1px`,\n          iconWrap: `flex:none;width:${hero ? 34 : 30}px;height:${hero ? 34 : 30}px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:${iconBg};color:${it.raw.c || '#6b6b70'}`,\n          iconPaths: it.raw.icon || I.chat,\n          titleFont: hero ? '600 14.5px system-ui' : '500 13.5px system-ui',\n          tPre: it.th.pre, tMatch: it.th.match, tPost: it.th.post,\n          hasSub: !!(it.sh.pre || it.sh.match),\n          sPre: it.sh.pre, sMatch: it.sh.match, sPost: it.sh.post,\n          progress: it.progress || '',\n          badge: it.badge || '', badgeColor: it.badgeColor || '#6b6b70', badgeBg: it.badgeBg || 'rgba(0,0,0,.06)',\n          meta: it.meta || '',\n          selected: selected ? true : '',\n        }\n      }),\n    }))\n\n    // preview from selected\n    const selItem = flat[sel]\n    const pv = this.buildPreview(selItem, kindTint)\n    const footer = this.footerFor(selItem)\n\n    return {\n      query: q,\n      scope,\n      clearScope: () => { this.setState({ query: '', sel: 0 }); const el = document.getElementById('cmd-input'); if (el) el.focus() },\n      onInput: (e) => this.setState({ query: e.target.value, sel: 0 }),\n      onKey: (e) => this.onKey(e, flat),\n      groups: outGroups,\n      resultCount: flat.length,\n      isEmpty: flat.length === 0 ? true : '',\n      pv,\n      footerLabel: footer.label,\n      primaryAction: footer.action,\n    }\n  }\n\n  tintOf(c) {\n    const map = { '#3478f6': 'rgba(52,120,246,.12)', '#5e5ce6': 'rgba(94,92,230,.13)', '#ff9500': 'rgba(255,149,0,.14)', '#34c759': 'rgba(52,199,89,.13)', '#ea4335': 'rgba(234,67,53,.12)', '#fb7299': 'rgba(251,114,153,.14)', '#1c1c1e': 'rgba(0,0,0,.08)', '#6b6b70': 'rgba(0,0,0,.06)' }\n    return map[c] || 'rgba(0,0,0,.06)'\n  }\n\n  buildPreview(it, tint) {\n    if (!it) return { title: '', iconPaths: this.ic.search, iconWrap: 'display:none', isDispatch: '', isChat: '', isTaskRun: '', isTaskSched: '', isInfo: '' }\n    const raw = it.raw\n    const color = raw.c || '#6b6b70'\n    const base = {\n      title: raw.title,\n      iconPaths: raw.icon || this.ic.chat,\n      color,\n      tint: tint[it.kind] || 'rgba(0,0,0,.06)',\n      iconWrap: `width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:${this.tintOf(color)};color:${color}`,\n      kindLabel: '', isDispatch: '', isChat: '', isTaskRun: '', isTaskSched: '', isInfo: '',\n      desc: '', hasRows: '', rows: [], steps: [], msgs: [], logs: [], last: '', progress: '', stepText: '', updated: '', count: '',\n    }\n    if (it.kind === 'dispatch') {\n      return { ...base, kindLabel: '新任务', isDispatch: true, title: '「' + raw.dispatchQuery + '」', iconPaths: this.ic.spark, color: '#5e5ce6',\n        steps: [{ n: 1, t: '拆解目标并制定执行计划' }, { n: 2, t: '并行检索与读取相关资料' }, { n: 3, t: '归纳整理并产出结果文件' }] }\n    }\n    if (it.kind === 'chat') {\n      return { ...base, kindLabel: '对话', isChat: true, updated: raw.updated, count: raw.count,\n        msgs: (raw.msgs || []).map((m) => ({ role: m[0], text: m[1], color: m[0] === 'Agent' ? '#5e5ce6' : '#8a8a84' })) }\n    }\n    if (it.kind === 'taskRun') {\n      return { ...base, kindLabel: '运行中', isTaskRun: true, color: '#5e5ce6', progress: raw.progress, stepText: raw.stepText,\n        logs: (raw.logs || []).map((l) => ({ t: l[0], m: l[1] })) }\n    }\n    if (it.kind === 'taskSched') {\n      return { ...base, kindLabel: '定时任务', isTaskSched: true, color: '#ff9500', last: raw.last,\n        rows: (raw.rows || []).map((r) => ({ k: r[0], v: r[1] })) }\n    }\n    const labels = { command: '命令', agent: '编队', file: '文件', service: '服务', memory: '记忆', skill: '技能' }\n    return { ...base, isInfo: true, kindLabel: labels[it.kind] || '', desc: raw.desc || '',\n      hasRows: raw.rows ? true : '', rows: (raw.rows || []).map((r) => ({ k: r[0], v: r[1] })) }\n  }\n\n  footerFor(it) {\n    if (!it) return { label: '无结果', action: '打开' }\n    const m = {\n      dispatch: { label: '交给研究编队执行', action: '开始任务' },\n      chat: { label: it.raw.title, action: '打开对话' },\n      command: { label: it.raw.title, action: '执行' },\n      agent: { label: '指派给「' + it.raw.title + '」', action: '指派' },\n      file: { label: it.raw.title, action: '打开文件' },\n      taskRun: { label: it.raw.title, action: '查看进度' },\n      taskSched: { label: it.raw.title, action: '查看' },\n      service: { label: '进入 ' + it.raw.title, action: '进入' },\n      memory: { label: it.raw.title, action: '编辑' },\n      skill: { label: it.raw.title, action: '管理' },\n    }\n    return m[it.kind] || { label: it.raw.title, action: '打开' }\n  }\n\n  onKey(e, flat) {\n    if (e.key === 'ArrowDown') { e.preventDefault(); this.setState((s) => ({ sel: Math.min(s.sel + 1, flat.length - 1) })) }\n    else if (e.key === 'ArrowUp') { e.preventDefault(); this.setState((s) => ({ sel: Math.max(s.sel - 1, 0) })) }\n    else if (e.key === 'Enter') { e.preventDefault(); const it = flat[this.state.sel]; if (it) this.run(it) }\n    else if (e.key === 'Escape') { e.preventDefault(); if (this.state.query) { this.setState({ query: '', sel: 0 }) } }\n    else if (e.key === 'Backspace' && this.state.query.length === 1) { this.setState({ query: '', sel: 0 }) }\n  }\n\n  run(it) {\n    // mock action feedback\n    const label = this.footerFor(it).action + ' · ' + it.raw.title\n    this.setState({ toast: label })\n    const el = document.getElementById('cmd-input'); if (el) el.focus()\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
