packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

catalog:
  # toolchain / framework (must stay in lockstep)
  typescript: ^7.0.2
  react: ^19.2.8
  react-dom: ^19.2.8
  '@tanstack/react-query': ^5.102.8
  vitest: ^5.0.0
  zod: ^4.5.4
  recharts: ^3.10.1
  # shadcn / tailwind UI stack (shared desktop <-> @swarm/ui)
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  lightningcss: ^1.33.0
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.41.0
  cmdk: ^1.1.1
  sonner: ^2.0.8
  vaul: ^1.1.2
  next-themes: ^0.4.6
  date-fns: ^4.4.0
  '@base-ui/react': ^1.8.0
  embla-carousel-react: ^8.6.0
  input-otp: ^1.5.0
  react-day-picker: ^10.0.1
  react-resizable-panels: ^4.12.3
  shadcn: ^4.21.0

overrides:
  '@types/react': '19.2.18'
  '@types/react-dom': '19.2.7'
  lightningcss: '1.33.0'
  # npmmirror has not synced sherpa-onnx-darwin-x64@1.13.7 yet; drop once synced.
  'sherpa-onnx-node': '1.13.6'

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
shamefullyHoist: true
allowBuilds:
  '@google/genai': false
  '@parcel/watcher': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  react-native-enriched-markdown: true
  spawn-sync: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
