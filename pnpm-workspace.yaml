packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

catalog:
  # toolchain / framework (must stay in lockstep)
  typescript: ^6.0.3
  react: ^19.2.7
  react-dom: ^19.2.7
  vitest: ^4.1.9
  zod: ^4.4.3
  recharts: ^3.9.2
  # shadcn / tailwind UI stack (shared desktop <-> @swarm/ui)
  tailwindcss: ^4.3.2
  '@tailwindcss/vite': ^4.3.2
  tw-animate-css: ^1.4.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  lucide-react: ^1.23.0
  cmdk: ^1.1.1
  sonner: ^2.0.7
  vaul: ^1.1.2
  next-themes: ^0.4.6
  date-fns: ^4.4.0
  '@base-ui/react': ^1.6.0
  embla-carousel-react: ^8.6.0
  input-otp: ^1.4.2
  react-day-picker: ^10.0.1
  react-resizable-panels: ^4.12.1
  shadcn: ^4.13.0

overrides:
  '@types/react': '19.2.17'
  '@types/react-dom': '19.2.3'

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
shamefullyHoist: true
allowBuilds:
  '@google/genai': false
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: false
  spawn-sync: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
